<!-- Web Sederhana Menghitung Nilai Ulangan -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Nilai Ulangan</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <h1>Aplikasi Penghitung Nilai KKA</h1>
    <label for="nilaihtml">Masukkan Nilai HTML :</label>
    <input type="number" id="nilaihtml" placeholder="Masukkan Nilai HTML">
    <label for="nilaicss">Masukkan Nilai CSS :</label>
    <input type="number" id="nilaicss" placeholder="Masukkan Nilai CSS">    
    <label for="nilaijs">Masukkan Nilai JS :</label>
    <input type="number" id="nilaijs" placeholder="Masukkan Nilai JS">
    <label for="nilaiestetika">Masukkan Nilai Estetika :</label>
    <input type="number" id="nilaiestetika" placeholder="Masukkan Nilai Estetika">
    <button onclick="">Hitung Nilai</button>

    <script src="script.js"></script>
 </body>
 </html>
