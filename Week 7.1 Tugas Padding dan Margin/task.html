<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Contoh Sederhana</title>
  <style>
    body {
      background-color: #f0f4f8;
    }

    .kotak {
      background-color: #ffffff;
      padding: 20px;      /* jarak dalam, antara teks dan tepi kotak */
      margin: 30px;       /* jarak luar, antara kotak dan elemen lain */
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    p {
      color: #333333;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="kotak">
    <p>Ini adalah contoh paragraph sederhana. Perhatikan bahwa kotak ini memiliki padding (jarak di dalam kotak) dan margin (jarak di luar kotak terhadap elemen lain).</p>
  </div>

</body>
</html>
