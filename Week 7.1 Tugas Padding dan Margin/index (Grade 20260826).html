<!DOCTYPE html>
<html>
<head>
    <title>Belajar CSS Dasar</title>

    <style>
        body {
            background-color: lightgray;
        }

        p {
            background-color: white;
            padding: 20px;
            margin: 30px;
        }
    </style>
</head>

<body>

    <h1>Belajar CSS Dasar</h1>

    <p>
        Ini adalah paragraph pertama.
        Paragraph ini memiliki background putih,
        padding 20px, dan margin 30px.
    </p>

    <p>
        Ini adalah paragraph kedua.
        Padding memberikan jarak di dalam elemen,
        sedangkan margin memberikan jarak di luar elemen.
    </p>

</body>
</html>
